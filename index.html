<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKSTORE-22</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Header -->
<header class="header">

    <h1 class="logo">KKSTORE-22</h1>

    <div class="search-box">
        <input type="search" id="search" placeholder="Search Products...">
        <button>
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </div>

    <nav class="menu">

        <a href="#">
            <i class="fa-regular fa-heart"></i>
            Wishlist
            <span id="wishlist-count">0</span>
        </a>

        <a href="#">
            <i class="fa-solid fa-cart-shopping"></i>
            Cart
            <span id="cart-count">0</span>
        </a>

    </nav>

</header>

<!-- Banner Slider -->
<div class="slider">

<img src="https://picsum.photos/1200/350?random=1" class="slide active">
<img src="https://picsum.photos/1200/350?random=2" class="slide">
<img src="https://picsum.photos/1200/350?random=3" class="slide">
</div>

<!-- Categories -->
<section class="categories">

    <button class="cat" data-category="All">All</button>
<button class="cat" data-category="Women">Women's Fashion</button>
<button class="cat" data-category="Men">Men's Fashion</button>
<button class="cat" data-category="Mobile">Mobile</button>
<button class="cat" data-category="Electronics">Electronics</button>
<button class="cat" data-category="Beauty">Beauty</button>
<button class="cat" data-category="Footwear">Footwear</button>
<button class="cat" data-category="Home">Home & Kitchen</button>
<button class="cat" data-category="Grocery">Grocery</button>
<button class="cat" data-category="Watches">Watches</button>
<button class="cat" data-category="Kurtas">Kurtas Under ₹299</button>

</section>

<!-- Products -->
<section class="products-section">

    <h2>Trending Products</h2>

    <div id="products" class="products"></div>

</section>

<!-- Product Modal -->
<div id="productModal" class="modal">

    <div class="modal-content">

        <span class="close">&times;</span>

        <img id="modalImage" alt="Product">

        <h2 id="modalName"></h2>

        <h3 id="modalPrice"></h3>

        <p id="modalRating"></p>

        <p id="modalDelivery"></p>

        <a id="buyNowLink" href="#" target="_blank">
            <button class="buy-btn">Buy Now</button>
        </a>

    </div>

</div>

<!-- Footer -->
<footer>
    <p>© 2026 KKSTORE-22. All Rights Reserved.</p>
</footer>

<script src="products.js"></script>
<script src="script.js"></script>

</body>
</html>
