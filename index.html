<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KKSTORE-22</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<header class="header">

<div class="logo">
KKSTORE-22
</div>

<div class="search-box">

<input type="text" id="search" placeholder="Search for Products...">

<button>

<i class="bi bi-search"></i>

</button>

</div>

<div class="menu">

<a href="#">
<i class="bi bi-person"></i>
Login
</a>

<div class="nav-right">

    <a href="#">
        <i class="fa-regular fa-heart"></i>
        Wishlist
        <span id="wishlist-count">0</span>
    </a>

    <a href="#">
        <i class="fa-solid fa-cart-shopping"></i>
        Cart
        <span id="cart-count">0</span>
    </a>

</div>

</header>

<section class="hero">

    <div class="slider">

        <img src="https://images-eu.ssl-images-amazon.com/images/G/31/img24/Wireless/Mounika/July9/D351705487_WLD_WD-campaign-GW_Desktop-Hero_3000x1200._CB758973735_.jpg" class="slide active">
        <img src="images/banner2.jpg" class="slide">
        <img src="images/banner3.jpg" class="slide">

    </div>

</section>

<h1>Welcome to KKSTORE-22</h1>

<p>Best Deals Under ₹299</p>

<a href="#" class="shop-btn">
Shop Now
</a>

</div>

</section>

<!-- Categories -->
<section class="categories">

<div class="cat" data-category="https://link.amazon/B02P6IblT">👗 Women</div>
<div class="cat" data-category="Men">👔 Men</div>
<div class="cat" data-category="Kids">👶 Kids</div>
<div class="cat" data-category="Top Brands">💎 Top Brands</div>
<div class="cat" data-category="Lingerie">🩱 Lingerie</div>
<div class="cat" data-category="Home & Kitchen">🏠 Home & Kitchen</div>
<div class="cat" data-category="Beauty">💄 Beauty</div>
<div class="cat" data-category="Footwear">👟 Footwear</div>
<div class="cat" data-category="Watches">⌚ Watches</div>
<div class="cat" data-category="Car & Bike">🏍️ Car & Bike</div>
<div class="cat" data-category="Grocery">🛒 Grocery</div>
<div class="cat" data-category="Books">📚 Books</div>
<div class="cat" data-category="Electronics">📱 Electronics</div>

</section>
<!-- Trending Products -->

<section class="products-section">

<h2>Trending Products</h2>

<div id="products" class="products"></div>

</section>

<script src="products.js"></script>
<script src="script.js"></script>
<div id="productModal" class="modal">

    <div class="modal-content">

        <span class="close">&times;</span>

        <img id="modalImage">

        <h2 id="modalName"></h2>

        <h3 id="modalPrice"></h3>

        <p id="modalRating"></p>

        <p id="modalDelivery"></p>

        <button class="buy-btn">Buy Now</button>

    </div>

</div>
</body>
</html>
