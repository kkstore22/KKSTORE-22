<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKSTORE-22</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Header -->
<header class="header">

    <h1 class="logo">KKSTORE-22</h1>

    <div class="search-box">
        <input type="search" id="search" placeholder="Search Products...">
        <button>
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </div>

    <nav class="menu">

        <a href="#">
            <i class="fa-regular fa-heart"></i>
            Wishlist
            <span id="wishlist-count">0</span>
        </a>

        <a href="#">
            <i class="fa-solid fa-cart-shopping"></i>
            Cart
            <span id="cart-count">0</span>
        </a>

    </nav>

</header>

<!-- Banner Slider -->
<div class="slider">

<img src="https://picsum.photos/1200/350?random=1" class="slide active">
<img src="https://picsum.photos/1200/350?random=2" class="slide">
<img src="https://picsum.photos/1200/350?random=3" class="slide">
</div>

<!-- Categories -->
<section class="categories">

<button class="cat" onclick="showAll()">All</button>
<button class="cat" onclick="toggleSub('women')">Women's Fashion</button>
<button class="cat" onclick="toggleSub('men')">Men's Fashion</button>
<button class="cat" onclick="toggleSub('electronics')">Electronics</button>
<button class="cat">Mobile</button>
<button class="cat">Beauty</button>
<button class="cat">Footwear</button>
<button class="cat">Home & Kitchen</button>
<button class="cat">Grocery</button>
<button class="cat">Watches</button>
<button class="cat">Kurtas Under ₹299</button>

</section>
<!-- Products -->
<section class="products-section">

    <h2>Trending Products</h2>

    <div id="products" class="products"></div>

</section>

<!-- Product Modal -->
<div id="productModal" class="modal">

    <div class="modal-content">

        <span class="close">&times;</span>

        <img id="modalImage" alt="Product">

        <h2 id="modalName"></h2>

        <h3 id="modalPrice"></h3>

        <p id="modalRating"></p>

        <p id="modalDelivery"></p>

        <a id="buyNowLink" href="#" target="_blank">
            <button class="buy-btn">Buy Now</button>
        </a>

    </div>

</div>

<!-- Footer -->
<footer>
    <p>© 2026 KKSTORE-22. All Rights Reserved.</p>
</footer>

<script src="products.js"></script>
<script src="script.js"></script>
<script>
function toggleSub(id) {
  let all = document.querySelectorAll('.subcategory');

  all.forEach(el => {
    if (el.id === id) {
      // toggle show/hide
      el.style.display = (el.style.display === "block") ? "none" : "block";
    } else {
      el.style.display = "none";
    }
  });
}

function showAll() {
  document.querySelectorAll('.subcategory').forEach(el => {
    el.style.display = "none";
  });
}
</script>
</body>
</html>
