<title>KKSTORE22</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial;background:#f1f3f6;}

/* HEADER */
.header{
  background:#131921;
  color:white;
  display:flex;
  align-items:center;
  padding:10px;
  position:sticky;
  top:0;
}
.logo{font-size:20px;font-weight:bold;}

.search-box{
  flex:1;
  display:flex;
  margin:0 10px;
}
.search-box input{
  width:100%;
  padding:8px;
  border:none;
}
.search-box button{
  background:#febd69;
  border:none;
  padding:8px;
}

/* MENU */
.menu{
  background:#232f3e;
  color:white;
  display:flex;
  overflow-x:auto;
}
.menu span{
  padding:10px;
}

/* BANNER */
.banner{
  height:180px;
  background:url('https://images.unsplash.com/photo-1607083206173-1bce0e4d6c47') center/cover no-repeat;
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:10px;
}
.product{
  background:white;
  padding:10px;
  border-radius:8px;
  text-align:center;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
.product img{
  width:100%;
  height:140px;
  object-fit:contain;
}
.product p{color:green;font-weight:bold;}
.product button{
  background:#ffd814;
  border:none;
  padding:8px;
  width:100%;
  margin-top:5px;
}

/* RESPONSIVE */
@media(min-width:600px){
  .products{grid-template-columns:repeat(3,1fr);}
}
@media(min-width:900px){
  .products{grid-template-columns:repeat(4,1fr);}
}
</style>
</head>

<!-- HEADER -->
<div class="header">
  <div class="logo">KKSTORE22</div>

  <div class="search-box">

// LOAD PRODUCTS
function loadProducts(list){
  let html="";
  list.forEach(p=>{
    html+=`
    <div class="product">
      <img src="${p.image}">
      <h4>${p.name}</h4>
      <p>${p.price}</p>
      <button onclick="buyNow('${p.link}')">Buy Now</button>
    </div>`;
  });
  document.getElementById("productList").innerHTML = html;
}

loadProducts(products);

// SEARCH
function searchProduct(){
  let val=document.getElementById("searchInput").value.toLowerCase();
  let filtered=products.filter(p=>p.name.toLowerCase().includes(val));
  loadProducts(filtered);
}

// BUY BUTTON (AFFILIATE)
function buyNow(link){
  window.open(link, "_blank");
